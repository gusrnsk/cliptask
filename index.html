<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><title>ClipTask</title></head>
<body style="font-family:sans-serif;max-width:600px;margin:40px auto;line-height:1.6">
  <h1>ClipTask</h1>
  <p>공문 및 업무 메시지에서 일정을 추출해 사용자의 Google Calendar에 등록하는 개인용 데스크톱 도구입니다.</p>
  <h2>개인정보처리방침</h2>
  <p>ClipTask는 사용자의 Google 계정 데이터를 외부 서버에 저장하거나 제3자에게 제공하지 않으며, 모든 인증 정보와 일정 데이터는 사용자의 로컬 PC와 Google API 간에만 직접 통신합니다.</p>
</body>
</html>
